<!-- LINHA A LINHA:

<input name="nome" placeholder="Seu primeiro nome" /> = Cria um campo de texto para o usuário digitar o nome.

Atributo name="nome" permite que esse campo seja facilmente selecionado no JavaScript.

placeholder="Seu primeiro nome" exibe um texto dentro do campo como sugestão.


<button type="button" onclick="verificarIdade()">Verificar idade</button> = Cria um botão que, ao ser clicado, chama a função 
verificarIdade() que está no script.


function verificarIdade() {
    Define uma função chamada verificarIdade, que será executada quando o botão for clicado.

    
    
    var nome = document.querySelector('input[name=nome]') = Usa document.querySelector para selecionar o campo do nome com base no atributo name.

    Armazena o elemento HTML (não o valor ainda!) na variável nome.


    console.log(nome.value) = Mostra no console o valor digitado no campo nome (por exemplo, "João"). -->
