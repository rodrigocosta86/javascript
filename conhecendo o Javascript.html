<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JavaScript</title>
</head>
<body>
    <h1>Olá, <span id="nome"></span></h1>


    <script type="text/javascript">
        var nome = "Rodrigo Costa";


        document.getElementById("nome").innerText = nome
    </script>
</body>
</html>




<!-- ANOTAÇÔES:

    - Digitando DOC no Visual Studio cria-se uma estrutura HTML.
    - Tag Script
    - No Javascript para criarmos uma variavel , usamos a palavra reservadar var
    - Javascript tem uma tipagem dinâmica, ou seja, o tipo da variavel é definido no momento que ela recebe o valor.

        Resumo da aula:
        Como o javaScript funciona dentro do arquivo HTML em uma simples aplicação WEB
        Um pouco de sitaxe de como criamos uma variavel, um elemento em uma pagina e definir um valor.

        LINHA A LINHA:

        <html lang="en"> Define que o idioma da página é inglês (lang="en"). /Início do documento HTML.

        <head> - Seção que contém metadados da página (não visíveis ao usuário).

        <meta charset="UTF-8"> - Define o padrão de codificação de caracteres como UTF-8, 
        que permite exibir corretamente acentos e caracteres especiais.

        <meta name="viewport" content="width=device-width, initial-scale=1.0"> - Configura o layout 
        para funcionar bem em dispositivos móveis (responsivo).

        <title>Cypress Discovery</title> - Define o título da aba do navegador como “Cypress Discovery”.

        </head> - Fim da seção <head>.

        <body> - Início do corpo da página, onde o conteúdo principal é exibido.

        <h1>Olá, <span id="nome"></span></h1>
            Um título grande (nível 1) que exibe a palavra "Olá," seguida de um <span> vazio com id="nome".
            Esse span será preenchido dinamicamente via JavaScript.
        
        <script type="text/javascript">
            Início do bloco de Javascript

         var nome = "Rodrigo Costa"; Cria uma variável chamada nome e armazena o texto "Rodrigo Costa" nela.

            document.getElementById("nome").innerText = nome = Encontra o elemento com id="nome" na página 
            (o <span> dentro do <h1>) e insere o conteúdo da variável nome dentro dele.
            Resultado final visível: Olá, Rodrigo Costa

        </script> = aliza o bloco de JavaScript.

        </body></html> = Fecha o corpo e o documento HTML.

        Esse código monta uma página simples que mostra:

        Olá, Rodrigo Costa

        O nome "Rodrigo Costa" é colocado dinamicamente via JavaScript.
