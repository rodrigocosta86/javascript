<body>
    <!-- <h1>Olá, <span id="nome"></span></h1> -->

        <h1>CNH</h1>

        <input name="nome" placeholder="Seu primeiro nome" />
        <input name="idade" placeholder="Sua idade" />
        <button type="button"onclick="verificarIdade()">Verificar idade</button>

        
        <h1>Cybercops</h1>

        <button type="button" onclick="listaCybercops()">Listar Cybercops</button>
        
        <ul id="cybercops">  
        </ul>

    <script type="text/javascript">

        //API
        var cybercops = ['Jupiter', 'Marte','Saturno','Mercurio', 'Lucifer']

        function listaCybercops() {

            var ul = document.getElementById('cybercops')
            ul.innerHTML = ''
            
            cybercops.forEach(function(a){

                var li = document.createElement('li')
                var text = document.createTextNode(a)
                li.appendChild(text)
                ul.appendChild(li)
            })
        }

        function verificarIdade(){
            
            var nome = document.querySelector('input[name=nome]')
            var idade = document.querySelector('input[name=idade]')
            
            console.log(nome.value)
            console.log(idade.value)

        }
